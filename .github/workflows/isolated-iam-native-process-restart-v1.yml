name: "Isolated IAM Native SIGKILL and Target Restart Reconciliation V1"

on:
  pull_request:
    paths:
      - ".github/workflows/isolated-iam-native-process-restart-v1.yml"
      - "scripts/enterprise_iam_lab/native_process_restart_probe.py"
      - "scripts/enterprise_iam_lab/run_native_docker.sh"
      - "scripts/enterprise_iam_lab/verify_native_docker.py"
      - "scripts/enterprise_iam_lab/reconcile_native_lost_ack.py"
      - "scripts/enterprise_iam_lab/target_service.py"
      - "tests/quality/test_iam_native_process_restart_v1.py"
      - "docs/ISOLATED_IAM_NATIVE_PROCESS_RESTART_RECONCILIATION_V1.md"
      - "veritas_os/policy/bind_effect_runtime.py"
      - "veritas_os/policy/bind_effect_reconciliation.py"
      - "veritas_os/policy/live_adapter_bind_authorization_consumption_store.py"
      - "compose.enterprise-iam-permit-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-iam-native-sigkill-restart-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-sigkill-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_test
          POSTGRES_DB: veritas_test
        options: >-
          --health-cmd "pg_isready -U veritas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      VERITAS_DATABASE_URL: "postgresql+psycopg://veritas:veritas_test@localhost:5432/veritas_test"
      VERITAS_DB_POOL_MIN_SIZE: "1"
      LAB_NATIVE_DURABLE_PG: "1"
      LAB_NATIVE_LOST_ACK: "1"
      LAB_NATIVE_PROCESS_RESTART: "1"
      LAB_REPORT_DIR: "artifacts/isolated-enterprise-iam-process-restart/latest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing production-code and disposable test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,signing]" "psycopg[binary]" psycopg-pool alembic
      - name: Migrate clean native authorization and durable effect-state PostgreSQL
        run: alembic upgrade head
      - name: Refuse fabricated Docker restart, changed persistent mounts, and forged ACK
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/quality/test_iam_native_process_restart_v1.py \
            tests/quality/test_iam_native_lost_ack_reconciliation_v1.py \
            tests/quality/test_iam_native_postgres_docker_v1.py \
            tests/quality/test_iam_native_docker_verifier_v1.py
      - name: Real process SIGKILL and original Docker target restart, then no-retry reconciliation
        run: bash scripts/enterprise_iam_lab/run_native_docker.sh
      - name: Validate durable SQL and target results, no second POST, real-process proofs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("artifacts/isolated-enterprise-iam-process-restart/latest")
          report=json.loads((folder/"verification_post_native.json").read_text())
          ck=json.loads((folder/"iam_sigkill_checkpoint.json").read_text())
          terminated=json.loads((folder/"iam_sigkill_observation.json").read_text())
          restarted=json.loads((folder/"iam_process_restart_observation.json").read_text())
          mark=json.loads((folder/"iam_reconciliation_mark_unknown.json").read_text())
          reconciled=json.loads((folder/"iam_reconciliation_reconcile.json").read_text())
          assert report["result"] == restarted["result"] == mark["result"] == reconciled["result"] == "PASS"
          assert report["proof_status"] == "SYNTHETIC_NATIVE_POSTGRES_PROCESS_SIGKILL_RESTART_RECONCILIATION_NOT_PROVEN"
          assert ck["effect_state"] == mark["effect_state"] == "EFFECT_UNKNOWN"
          assert ck["operation_id"] == mark["operation_id"] == reconciled["operation_id"]
          assert ck["target_ledger_read_before_sigkill"] is False
          assert terminated["observed_exit_code"] == 137
          assert terminated["expected_termination_signal"] == "SIGKILL"
          assert restarted["process_killed_by_real_sigkill"] is True
          assert restarted["same_docker_container_restarted"] is True
          assert restarted["target_process_pid_changed"] is True
          assert restarted["target_process_start_time_changed"] is True
          assert restarted["target_healthy_after_restart"] is True
          assert restarted["same_target_owned_sqlite_mount"] is True
          assert restarted["target_owned_sqlite_effect_survived_target_restart"] is True
          assert restarted["native_postgres_effect_state_still_unknown"] is True
          assert report["native_postgres_consumption_rows"] == 1
          assert report["target_effects_linked_to_postgres"] == 1
          assert report["native_postgres_idempotency_rows"] == 1
          assert report["real_mtls_allowed_exactly_once"] is True
          assert report["replay_rejected"] is True
          assert report["durable_effect_state_before"] == "EFFECT_UNKNOWN"
          assert report["durable_effect_state_after"] == "CONFIRMED_EFFECT"
          assert report["terminal_immutable"] is True
          assert report["mutation_retried"] is False
          assert report["native_permit_reissued"] is False
          assert report["target_post_retried_after_restart"] is False
          assert report["independent_operator_reconciliation"] is False
          assert report["whole_host_crash_simulated"] is False
          assert report["production_claim"] is False
          assert reconciled["paid_provider_calls"] == 0
          assert reconciled["external_cloud_iam_effects"] == 0
          print("IAM_2378_REAL_SIGKILL_DOCKER_RESTART_RECONCILIATION_BOUNDED_PASS_NOT_PROVEN")
          PY
          cd "$LAB_REPORT_DIR"
          find . -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          sha256sum --check manifest.sha256
      - name: Upload only sanitized process and effect proof, never keys, bearer permits or databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-iam-native-process-sigkill-restart-v1
          path: artifacts/isolated-enterprise-iam-process-restart/latest/
          retention-days: 30
          if-no-files-found: warn
